name: WearerKey Verification CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Test, Build & Audit Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Monorepo
        run: pnpm typecheck

      - name: Run Vitest Unit & Integration Tests
        run: pnpm test

      - name: Build Monorepo (Contracts, Domain, API, Web)
        run: pnpm build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E & Axe Accessibility Checks
        run: npx playwright test

      - name: Run Security & Secret Scan
        run: npx tsx scripts/security-scan.ts

      - name: Validate Truthfulness & Claims
        run: npx tsx scripts/check-claims.ts
