name: YouCam Clothes V4 Live Smoke Probe

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  live-smoke:
    name: Fail-Closed Live YouCam Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Live YouCam Smoke (Fail-Closed)
        env:
          YOUCAM_API_KEY: ${{ secrets.YOUCAM_API_KEY }}
        run: npx tsx scripts/live-youcam-smoke.ts --require-live

      - name: Upload Verified Receipt Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-youcam-receipt
          path: |
            docs/live-youcam-receipt.json
            docs/verification-results.json
